name: app name

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'  # corrected typo from 'termurin'

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: MultiplicationTable
        
      - name: Build with project
        run: ./gradlew build
        working-directory: MultiplicationTable
      

